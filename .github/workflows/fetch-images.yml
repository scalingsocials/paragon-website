name: Fetch and compress product images
on:
  push:
    paths:
      - images/manifest.txt
      - scripts/fetch_images.py
      - .github/workflows/fetch-images.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Add compressed product images" || echo "nothing to commit"
          git push
